name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sbp_test_ci
          MYSQL_USER: sbp
          MYSQL_PASSWORD: ci_test_only
          MYSQL_ROOT_PASSWORD: ci_root_only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql+asyncmy://sbp:ci_test_only@127.0.0.1:3306/sbp_test_ci
      TEST_DATABASE_URL: mysql+asyncmy://sbp:ci_test_only@127.0.0.1:3306/sbp_test_ci
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: alembic downgrade base && alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
