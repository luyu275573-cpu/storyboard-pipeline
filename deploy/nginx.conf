# ============================================================
# 分镜流水线 · Nginx 反向代理配置
# ============================================================
# 使用方式：
#   1. 将本文件复制到 /etc/nginx/sites-available/storyboard-pipeline
#   2. ln -s /etc/nginx/sites-available/storyboard-pipeline /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# ⚠️ 需按实际环境修改的值已用 [TODO] 标注
# ============================================================

upstream storyboard_api {
    # uvicorn 监听地址，与 systemd 服务中的 --host/--port 保持一致
    server 127.0.0.1:8100;
}

server {
    listen 80;
    # [TODO] 替换为实际域名；若暂用 IP 可改为 _ 或具体 IP
    server_name storyboard.example.com;

    # [TODO] 生产环境建议启用 HTTPS（certbot 自动配置）
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/storyboard.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/storyboard.example.com/privkey.pem;

    # ---------- 安全响应头 ----------
    # 防止点击劫持、MIME 嗅探、XSS 反射等常见 Web 攻击
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---------- 上传大小限制 ----------
    # 视频素材单文件可达数百 MB，这里给到 500M
    # 如果素材更大可按需调整，但要注意 Nginx 会先把整个 body 读到临时文件再转发
    client_max_body_size 500m;

    # ---------- 日志 ----------
    access_log /var/log/nginx/storyboard_access.log;
    error_log  /var/log/nginx/storyboard_error.log;

    # ==========================================================
    # SSE 进度推送接口 —— 这是本项目最关键的 Nginx 配置
    # ==========================================================
    # 为什么需要单独处理？
    #   SSE（Server-Sent Events）是长连接、逐条推送的协议。
    #   Nginx 默认开启 proxy_buffering，会把后端响应攒到一定大小才发给客户端。
    #   结果就是前端看不到实时进度，事件被"吞"在缓冲区里。
    #   上一个 Flask 项目踩过这个坑，这次必须显式关闭。
    # ==========================================================
    location /api/v1/stream {
        proxy_pass http://storyboard_api;

        # ★ 核心：关闭代理缓冲，让每个 SSE 事件立即下发
        proxy_buffering off;
        # ★ 关闭缓存，SSE 是实时流不应被缓存
        proxy_cache off;
        # ★ 告知上游（uvicorn）不要缓冲：Nginx 发 X-Accel-Buffering: no 头
        #   FastAPI/Starlette 检测到这个头后会禁用自身的响应缓冲
        proxy_set_header X-Accel-Buffering no;

        # ★ SSE 是长连接，默认 60s 超时太短，视频生成可能持续数分钟
        #   设为 3600s（1小时），覆盖最长的视频渲染任务
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # SSE 不使用 gzip：压缩会引入额外缓冲层，且 SSE 文本本身很小
        gzip off;

        # 标准反向代理头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 + Connection keep-alive 是 SSE 长连接的基础
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://storyboard_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 请求也可能较慢（触发视频生成后等待响应），适当放宽
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- Swagger / ReDoc 文档 ----------
    # 开发/调试阶段保留，生产可通过 IP 白名单或 basic auth 保护
    location /docs {
        proxy_pass http://storyboard_api;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://storyboard_api;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://storyboard_api;
        proxy_set_header Host $host;
    }

    # ---------- 静态资源：storage 目录 ----------
    # 生成的图片/视频/成片通过 Nginx 直接serve，不走 Python，性能更好
    # [TODO] 确认 storage 路径与实际部署一致
    location /storage/ {
        alias /opt/storyboard-pipeline/storage/;
        # 媒体文件浏览器缓存 1 天，减少重复下载
        expires 1d;
        add_header Cache-Control "public, immutable";
        # 禁止列出目录内容
        autoindex off;
    }

    # ---------- 健康检查端点 ----------
    location /health {
        proxy_pass http://storyboard_api;
        # 健康检查不需要日志刷屏
        access_log off;
    }

    # ---------- 兜底 ----------
    location / {
        return 404 '{"detail": "Not Found"}';
        add_header Content-Type application/json;
    }
}
