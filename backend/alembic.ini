# Keep this INI ASCII: Alembic reads it using the Windows locale encoding.
# migrations/env.py reads DATABASE_URL from .env to keep credentials out of Git.

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamp prefix for migration ordering and traceability.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = Asia/Shanghai
version_path_separator = os
# Injected by env.py; migrations use the async database driver.
sqlalchemy.url =

[post_write_hooks]
# Format generated migrations with Ruff (activate the virtualenv first).
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
